; Soulbringer Modern settings
; Read when the game starts: changes take effect on the next launch.
; Every setting can be left out; the game then uses the value shown here.

; ============================================================================
[Display]
; ============================================================================
; 1 = native widescreen: the world is drawn with correct proportions and you
;     see more on the sides. 0 = the original stretched picture.
Widescreen=1

; Widest shape the game is shown at. On a wider screen the picture keeps this
; shape, centered, with black bars left and right; the HUD sits at its edges.
; 0 = no limit, or a ratio such as 16:9, 16:10, 21:9, 32:9 (or a number, 2.39).
MaxAspect=0

; ============================================================================
[Interface]
; ============================================================================
; 1 = menus, inventory and other full screens at their original 4:3 shape
;     (black bars at the sides), and the HUD with correct proportions.
; 0 = the original stretched menus and HUD.
Layout=1

; Where the HUD sits (with Layout=1):
;   split     = bottom bar at the bottom center, action column at the right edge
;   right     = the whole HUD together in the bottom-right corner
;   center    = the whole HUD together, centered
;   stretched = the original stretched HUD
Hud=split

; Mouse cursor size, percent (50-600). The original cursor is tiny at 4K.
CursorSize=200

; ============================================================================
; Text size
; ============================================================================
; Sizes are percent of the game's own size (50-600). The game lays its text
; out at the larger size itself, so lines wrap and boxes grow to fit.
;
; Size sets all text. Each category below has an All that sets the whole
; category, and items for single screens or areas. 0 = follow the level above:
; an item follows its category's All, an All follows Size.
; Fixed panels (the options menu rows, the HUD slots) can cut off text that is
; too large: raise those a little at a time.

[Text]
Size=200
; Tooltips next to the cursor everywhere: world objects, HUD, inventory items
; and slots, menu buttons.
Tooltips=0

[Text.Menus]
All=0
; New Game, Load Game, Options, Credits, Quit, copyright line
MainMenu=0
; save / load list: save names, level, date
SaveList=0
; options menu (fixed rows)
Options=0
; The quit dialog follows All.

[Text.Screens]
All=0
; character stats and numbers, Encumbrance, inventory numbers, stack counts
Character=0
; character and equipment labels: Armour Value, Gold, Ring, Hit Points,
; Mana Points; the "Character screen" and "Journal" titles
Labels=0
; quest titles and entries
Journal=0
; map title and descriptions
Map=0
; credits and GAME OVER
Credits=0

[Text.Game]
All=0
; what the character says (beside the portrait) and your reply choices
Conversations=0
; HUD column move labels (CUT, CUT LOW, ...) and COMBO
HudLabels=0
; names of characters under the cursor
Names=0
; messages: "Gained object: ...", "Empty.", "Locked.", "You died!"
Messages=0
; place names ("The Eastern River")
PlaceNames=0
; damage numbers in a fight
CombatNumbers=0

; ============================================================================
[Fonts]
; ============================================================================
; The game's fonts are small pixel fonts that turn blurry or blocky when
; enlarged. Soulbringer Modern redraws them sharp from bundled fonts (in
; SoulbringerModern\fonts\, SIL Open Font License), in the game's own colours.
;   Sharp    = every font redrawn
;   Original = the game's own letters everywhere (to compare)
All=Sharp

; Optional: choose per font. Empty = follow All.
; Any choice can also be Original. Names and Menu also take a font file of
; your own (.ttf or .otf, relative to the game folder), for example
; Menu=SoulbringerModern\fonts\MyFont.ttf
;
; names of characters, and messages: SoulbringerText
Names=
; tooltips, place names, HUD bar labels: SoulbringerText | Cardo
Tooltips=
; the journal: SoulbringerText | Cardo
Journal=
; menus, save list, quit dialog, conversations: SoulbringerUncial | MedievalSharp
Menu=
; options, stats, inventory numbers, HUD move labels: Montserrat
Interface=
; combat damage numbers: Montserrat
Numbers=
; credits and GAME OVER: SoulbringerCredits
Credits=

; ============================================================================
[Debug]
; ============================================================================
; For development and troubleshooting. Leave as is for normal play.

; 1 = write a log next to the game, one file per session
;     (SoulbringerModern_<exe>_<process id>.log). Costs some performance.
Log=0
; With Log=1: capture each new screen once (F9 forces a capture).
AutoCapture=1
; With Log=1: key that saves a screenshot (Screenshots\SBM_<pid>_<n>.bmp) and a
; frame capture of the same frame. F1-F24, or 0 = off. Avoid F10 and F12.
ScreenshotKey=F11
; 1 = every enhancement off: the game as shipped, for reference screenshots.
Stock=0

; Troubleshooting switches (1 = on, the normal setting):
; TextHook: the game lays out its text at the sizes above. 0 = only cursor
;   tooltips are enlarged (stretched), the menu and name fonts stay original.
TextHook=1
; HudMouse: clicks and tooltips on the moved HUD follow where it is drawn.
HudMouse=1
; ConversationPortraitHold: in conversations the game skips the portrait for a
;   frame at each new line, so it flickers; 1 = draw the last portrait then.
ConversationPortraitHold=1
; Developers: 1 = every text place gets its own font copy, and with Log=1
;   "place:" lines name the place behind each new piece of text.
FontPlaces=0
